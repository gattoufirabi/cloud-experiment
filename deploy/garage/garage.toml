# Garage (S3-compatible object storage), single node. Secrets come from the
# environment: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN (see compose files).
# The region must match S3_REGION of the platform.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

# Website buckets: Caddy maps <bucket>.web.<apps domain> to the Host "<bucket>.web".
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web"

[admin]
api_bind_addr = "[::]:3903"
