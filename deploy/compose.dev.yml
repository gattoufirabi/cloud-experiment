# Local development stack. Console: http://console.localhost:8088
# Tenant apps: http://<service>-<project>-<org>.apps.localhost:8088
#
# DEVELOPMENT ONLY: tenant containers run with runc (no gVisor sandbox), passwords are
# fixed, and TLS is off. See README "Production" for the hardened setup.
name: platform-dev

x-app: &app
  build: ..
  image: platform:dev
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &env
    BASE_URL: http://console.localhost:8088
    CONSOLE_HOST: console.localhost
    APPS_DOMAIN: apps.localhost
    SIGNUP_ENABLED: "true"
    SIGNUP_POW_BITS: "8"           # dev: easy proof of work (production default 16)
    ANOMALY_MINUTES: "1"           # dev: quick CPU-anomaly test (production default 30)
    OPERATOR_NTFY_URL: http://ntfy/platform-operator
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_TLS: none                 # dev only: local mail catcher
    SMTP_FROM: Staysa Cloud <noreply@example.test>
    BUILDS_ENABLED: "true"
    BUILD_ALLOW_INSECURE_REPOS: "true"   # dev only: the e2e test serves its repository over http
    BILLING_ENABLED: "true"
    BILLING_CURRENCY: EUR
    BILLING_TAX_PERCENT: "20"
    BILLING_SELLER: 'Example Hosting (fictitious)|1 Example Street|75000 Paris'
    MASTER_KEY_FILE: /run/secrets/master.key
    VICTORIALOGS_URL: http://victorialogs:9428
    VICTORIAMETRICS_URL: http://victoriametrics:8428
    # Registry: "localhost:8088" because Docker allows plain HTTP only for localhost.
    REGISTRY_HOST: localhost:8088
    REGISTRY_INTERNAL_SECRET: dev-registry-internal-secret
    # Dev only: lets alert channels point at the local ntfy container (a private address).
    ALERT_ALLOW_PRIVATE_TARGETS: "true"
    # Object storage: clients use port 8088; services reach the proxy on port 80.
    S3_HOST: s3.localhost:8088
    S3_SERVICE_URL: http://s3.localhost
    GARAGE_ADMIN_TOKEN: dev-garage-admin-token
    # Dev only: single sign-on against the e2e test's local provider (http, private address).
    OIDC_ALLOW_INSECURE: "true"
    EMAIL_DNS_RESOLVER: e2e-dns:53     # dev only: the e2e test's DNS server (mockoidc -dns)
    EMAIL_SPF_INCLUDE: spf.example.test
    # Dev: tenants' email is delivered directly to the recipients' "mail servers", which
    # the e2e test's DNS points at Mailpit and a refusing test server (port 1025).
    EMAIL_DELIVERY: direct
    EMAIL_DIRECT_PORT: "1025"
    EMAIL_DIRECT_ALLOW_PRIVATE: "true"
    SMTP_SUBMISSION_LISTEN: ":2587"
    SMTP_SUBMISSION_UPSTREAM: "api:2587"
    # Public database endpoints: the agent runs this image in mode "dbproxy".
    DBPROXY_IMAGE: "platform:dev"
    DNS_NAMESERVERS: ns1.platform.test,ns2.platform.test
    PUBLIC_IP: 127.0.0.1
    STALWART_URL: http://stalwart:8080
    STALWART_ADMIN: admin:dev-stalwart-admin
    WEBMAIL_HOST: webmail.localhost      # http://webmail.localhost:8088
    SIGNUPS_PER_HOUR: "100"            # dev only: the e2e test signs up several times per run
    # Dev only: both test nodes share one Docker host and its local backup volume.
    MOVES_SHARED_LOCAL_REPO: "true"
    BACKUPS_ENABLED: "true"
  volumes:
    - ./dev-secrets/master.key:/run/secrets/master.key:ro

services:
  # S3-compatible object storage. Reached by Caddy (s3.localhost, *.web.apps.localhost)
  # and by the API/agent (admin API); never published.
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GARAGE_RPC_SECRET: 4f2c6a1e9b3d5f7a8c0e2b4d6f8a1c3e5b7d9f0a2c4e6b8d0f1a3c5e7b9d2f4a
      GARAGE_ADMIN_TOKEN: dev-garage-admin-token
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: dev-owner-password
      POSTGRES_DB: platform
      API_DB_PASSWORD: dev-api-password
      AGENT_DB_PASSWORD: dev-agent-password
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_owner -d platform"]
      interval: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *env
      ADMIN_DATABASE_URL: postgres://platform_owner:dev-owner-password@postgres:5432/platform
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *env
      DATABASE_URL: postgres://platform_api:dev-api-password@postgres:5432/platform
      ADMIN_DATABASE_URL: postgres://platform_owner:dev-owner-password@postgres:5432/platform
      REGISTRY_EVENTS_SECRET: dev-registry-events-secret
      REGISTRY_TOKEN_KEY_FILE: /run/secrets/registry-token.key
    volumes:
      - ./dev-secrets/master.key:/run/secrets/master.key:ro
      - ./dev-secrets/registry-token.key:/run/secrets/registry-token.key:ro
    healthcheck:
      test: ["CMD", "/platform", "healthcheck"]
      interval: 10s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }

  agent:
    <<: *app
    container_name: platform-agent
    command: ["agent"]
    user: "0:0" # Docker socket access; in production the agent runs the same way, never exposed
    environment:
      <<: *env
      DATABASE_URL: postgres://platform_agent:dev-agent-password@postgres:5432/platform
      RUNTIME: runc
      ALLOW_INSECURE_RUNTIME: "true"
      AGENT_CONTAINER: platform-agent
      CADDY_CONTAINER: platform-caddy
      DNS_LISTEN: ":53"                  # DNS hosting (queried on the platform-core network in dev)
      TLS_MODE: "off"
      SCANNER_ENABLED: "true"
      TRIVY_TOKEN: dev-trivy-token
      # Dev only: scan containers share the Docker VM's network so they reach the registry
      # at localhost:8088 and the Trivy server at 127.0.0.1:4954, like the Docker daemon does.
      SCANNER_NETWORK: host
      TRIVY_SERVER_URL: http://127.0.0.1:4954
      SCANNER_INSECURE: "true"
      # Per-client backups: one restic repository per organization in this volume.
      # Production: set BACKUP_REST_URL to a rest-server you own (off-site, over WireGuard).
      BACKUPS_ENABLED: "true"
      BACKUP_VOLUME: platform-backups
      ALERTS_ENABLED: "true"
      ALERT_INTERVAL_SECONDS: "5"
    volumes:
      - ./dev-secrets/master.key:/run/secrets/master.key:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy-admin:/run/caddy
    depends_on:
      migrate: { condition: service_completed_successfully }
      caddy: { condition: service_started }

  # A second node for testing several servers on one machine (profile "multinode").
  # It acts as a worker: runs only the projects placed on it and publishes their ports;
  # the primary's proxy reaches them through host.docker.internal (a WireGuard address
  # in production).
  agent2:
    <<: *app
    container_name: platform-agent-2
    command: ["agent"]
    user: "0:0"
    profiles: ["multinode"]
    environment:
      <<: *env
      DATABASE_URL: postgres://platform_agent:dev-agent-password@postgres:5432/platform
      RUNTIME: runc
      ALLOW_INSECURE_RUNTIME: "true"
      AGENT_CONTAINER: platform-agent-2
      NODE_ID: node-2
      NODE_ROLE: worker
      NODE_CLUSTER: default
      NODE_ADDRESS: host.docker.internal
      NODE_BIND: 0.0.0.0
      TLS_MODE: "off"
      ALERTS_ENABLED: "true"
      ALERT_INTERVAL_SECONDS: "5"
      BACKUPS_ENABLED: "true"
      BACKUP_VOLUME: platform-backups
    volumes:
      - ./dev-secrets/master.key:/run/secrets/master.key:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Builds from git: helper image (git + Railpack). Built and run once by "up"; the
  # agent starts it for each build. Keeping this stopped container also protects the
  # image from "docker image prune -a".
  builder-image:
    image: platform-builder:0.43.0
    build: ./builder
    command: ["true"]
    restart: "no"

  caddy:
    image: platform-caddy:2.11.9-cache-l4
    build: ./caddy   # Caddy + Coraza WAF + rate limit (see caddy/Dockerfile)
    container_name: platform-caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/initial.json"]
    ports: ["8088:80", "1465:465"]
    volumes:
      - ./caddy/initial.json:/etc/caddy/initial.json:ro
      - caddy-admin:/run/caddy
      - caddy-data:/data

  registry:
    image: registry:2.8.3
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    entrypoint: ["/bin/sh", "-c", "sed \"s|__EVENTS_SECRET__|$${REGISTRY_EVENTS_SECRET}|\" /etc/registry/config.tmpl.yml > /tmp/config.yml && exec registry serve /tmp/config.yml"]
    environment:
      REGISTRY_EVENTS_SECRET: dev-registry-events-secret
      REGISTRY_AUTH_TOKEN_REALM: http://localhost:8088/token
    volumes:
      - ./registry/config.tmpl.yml:/etc/registry/config.tmpl.yml:ro
      - ./dev-secrets/registry-token.crt:/etc/registry/token.crt:ro
      - registry-data:/var/lib/registry

  trivy:
    image: aquasec/trivy:0.58.1
    restart: unless-stopped
    command: ["server", "--listen", "0.0.0.0:4954", "--cache-dir", "/cache"]
    environment:
      TRIVY_TOKEN: dev-trivy-token
    ports: ["127.0.0.1:4954:4954"] # dev: reachable by scan containers on the VM network
    volumes: [trivy-cache:/cache]

  # Webmail of hosted mailboxes: http://webmail.localhost:8088
  webmail:
    image: platform:dev
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["webmail"]
    environment:
      STALWART_URL: http://stalwart:8080
      WEBMAIL_HOST: webmail.localhost
      BASE_URL: http://console.localhost:8088

  # Hosted mailboxes. Dev ports: SMTP 2525, submission 2588, IMAP 2993, POP3 2995
  # (self-signed certificate: TLS is off in dev).
  stalwart:
    image: stalwartlabs/stalwart:v1.1.1
    container_name: platform-stalwart
    restart: unless-stopped
    # its binary carries the capability to bind ports below 1024 (no no-new-privileges)
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      STALWART_RECOVERY_ADMIN: admin:dev-stalwart-admin
    ports: ["127.0.0.1:2525:25", "127.0.0.1:2588:587", "127.0.0.1:2993:993", "127.0.0.1:2995:995"]
    volumes:
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart

  # Local mail catcher for signup emails: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]

  # Local notification receiver for testing alert channels: http://localhost:8090
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://localhost:8090
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
    ports: ["127.0.0.1:8090:80"]
    volumes: [ntfy-data:/var/lib/ntfy]

  victorialogs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    restart: unless-stopped
    command: ["-storageDataPath=/vlogs", "-retentionPeriod=31d"]
    volumes: [vlogs:/vlogs]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.110.0
    restart: unless-stopped
    command: ["-storageDataPath=/vmdata", "-retentionPeriod=30d"]
    volumes: [vmdata:/vmdata]

networks:
  default:
    name: platform-core

volumes:
  garage-data:
  stalwart-data:
  pgdata:
  caddy-admin:
  caddy-data:
  vlogs:
  vmdata:
  registry-data:
  trivy-cache:
  backups:
    name: platform-backups
  ntfy-data:
