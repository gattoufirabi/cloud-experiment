# Production stack (single server). Requires Phase 0 on the host:
#   host/install-gvisor.sh, host/tenant-firewall.sh (+ its systemd unit), host/isolation-test.sh passing.
# Configure deploy/.env from deploy/.env.example, create the master key, then:
#   docker compose -f compose.prod.yml up -d --build
name: platform

x-app: &app
  build: ..
  image: platform:${PLATFORM_VERSION:-local}
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  environment: &env
    BASE_URL: https://${CONSOLE_HOST:?set CONSOLE_HOST}
    CONSOLE_HOST: ${CONSOLE_HOST}
    APPS_DOMAIN: ${APPS_DOMAIN:?set APPS_DOMAIN}
    # Self-signup (off by default). Needs an SMTP server for confirmation emails.
    SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
    SIGNUP_DAILY_LIMIT: ${SIGNUP_DAILY_LIMIT:-50}
    SIGNUP_TRIAL_DAYS: ${SIGNUP_TRIAL_DAYS:-14}
    SIGNUP_BLOCKED_DOMAINS: ${SIGNUP_BLOCKED_DOMAINS:-}
    SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_TLS: ${SMTP_TLS:-starttls}
    EMAIL_SPF_INCLUDE: ${EMAIL_SPF_INCLUDE:-}
    # Tenants' email: "direct" to recipients' mail servers (port 25; the server's reverse
    # DNS should name MAIL_HOSTNAME, by default the console host), "relay" through
    # SMTP_HOST, or "off". Default: relay when SMTP_HOST is set, direct otherwise.
    EMAIL_DELIVERY: ${EMAIL_DELIVERY:-}
    MAIL_HOSTNAME: ${MAIL_HOSTNAME:-}
    # SMTP submission for tenants' apps: Caddy ends TLS on port 465 and forwards to the API.
    SMTP_SUBMISSION_LISTEN: ":2587"
    SMTP_SUBMISSION_UPSTREAM: "api:2587"
    # Public database endpoints: the agent runs this image in mode "dbproxy".
    DBPROXY_IMAGE: "platform:${PLATFORM_VERSION:-local}"
    DNS_NAMESERVERS: ${DNS_NAMESERVERS:-}
    # Hosted mailboxes: the mail server (service stalwart), managed through its admin API.
    STALWART_URL: ${STALWART_URL:-http://stalwart:8080}
    STALWART_ADMIN: admin:${STALWART_ADMIN_PASSWORD:-}
    # The webmail's public name (for example webmail.example.com); empty turns it off.
    WEBMAIL_HOST: ${WEBMAIL_HOST:-}
    PUBLIC_IP: ${PUBLIC_IP:-}
    OPERATOR_NTFY_URL: ${OPERATOR_NTFY_URL:-}
    # resolv.conf for gVisor containers (they cannot use Docker's embedded DNS); set by host/deploy.sh
    TENANT_RESOLV_CONF: ${TENANT_RESOLV_CONF:-}
    # Builds from git (rootless BuildKit sandbox, network pt-build). Verify on the server
    # before enabling; BUILD_RUNTIME=runsc runs the build containers under gVisor.
    BUILDS_ENABLED: ${BUILDS_ENABLED:-false}
    BUILD_RUNTIME: ${BUILD_RUNTIME:-}
    # Invoices (usage is metered either way). Seller lines are separated by "|".
    BILLING_ENABLED: ${BILLING_ENABLED:-false}
    BILLING_CURRENCY: ${BILLING_CURRENCY:-EUR}
    BILLING_TAX_PERCENT: ${BILLING_TAX_PERCENT:-0}
    BILLING_SELLER: ${BILLING_SELLER:-Platform operator}
    COOKIE_SECURE: "true"
    MASTER_KEY_FILE: /run/secrets/master.key
    VICTORIALOGS_URL: http://victorialogs:9428
    VICTORIAMETRICS_URL: http://victoriametrics:8428
    REGISTRY_HOST: ${REGISTRY_HOST:?set REGISTRY_HOST}
    REGISTRY_INTERNAL_SECRET: ${REGISTRY_INTERNAL_SECRET:?set REGISTRY_INTERNAL_SECRET}
    # Object storage (S3 API at https://$S3_HOST, website buckets at *.web.$APPS_DOMAIN).
    S3_HOST: ${S3_HOST:-}
    GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
  volumes:
    - ./secrets/master.key:/run/secrets/master.key:ro

services:
  postgres:
    image: postgres:17-alpine
    # Reachable by worker nodes over WireGuard only (127.0.0.1 = this server only).
    ports: ["${CONTROL_PLANE_ADDRESS:-127.0.0.1}:5432:5432"]
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD}
      POSTGRES_DB: platform
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD}
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - /srv/platform/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_owner -d platform"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 512M } } }

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *env
      ADMIN_DATABASE_URL: postgres://platform_owner:${OWNER_DB_PASSWORD}@postgres:5432/platform
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *env
      DATABASE_URL: postgres://platform_api:${API_DB_PASSWORD}@postgres:5432/platform
      ADMIN_DATABASE_URL: postgres://platform_owner:${OWNER_DB_PASSWORD}@postgres:5432/platform
      REGISTRY_EVENTS_SECRET: ${REGISTRY_EVENTS_SECRET:?set REGISTRY_EVENTS_SECRET}
      REGISTRY_TOKEN_KEY_FILE: /run/secrets/registry-token.key
    volumes:
      - ./secrets/master.key:/run/secrets/master.key:ro
      - ./secrets/registry-token.key:/run/secrets/registry-token.key:ro
    healthcheck:
      test: ["CMD", "/platform", "healthcheck"]
      interval: 15s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { resources: { limits: { memory: 256M, cpus: "1.0" } } }

  agent:
    <<: *app
    container_name: platform-agent
    command: ["agent"]
    user: "0:0"
    # DNS hosting: authoritative answers on the server's public address (DNS_BIND_IP; off
    # by default: bound to the loopback, so nothing is exposed until it is set).
    ports:
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/tcp"
    environment:
      <<: *env
      DATABASE_URL: postgres://platform_agent:${AGENT_DB_PASSWORD}@postgres:5432/platform
      RUNTIME: runsc
      AGENT_CONTAINER: platform-agent
      CADDY_CONTAINER: platform-caddy
      DNS_LISTEN: ${DNS_LISTEN:-}
      NODE_ID: ${NODE_ID:-}
      NODE_ROLE: primary
      NODE_CLUSTER: ${NODE_CLUSTER:-default}
      NODE_ADDRESS: ${CONTROL_PLANE_ADDRESS:-}
      TLS_MODE: acme
      SCANNER_ENABLED: "true"
      BACKUPS_ENABLED: "true"
      ALERTS_ENABLED: "true"
      # Off-site repositories (rest-server on a machine you own, reached over WireGuard).
      # Leave empty to keep repositories in the local "platform-backups" volume (not off-site).
      BACKUP_REST_URL: ${BACKUP_REST_URL:-}
      BACKUP_VOLUME: platform-backups
      TRIVY_TOKEN: ${TRIVY_TOKEN:?set TRIVY_TOKEN}
      MAX_CPU_MILLIS: ${MAX_CPU_MILLIS:-4000}
      MAX_MEMORY_MB: ${MAX_MEMORY_MB:-8192}
      MAIL_CERT_DIR: /run/caddy-certs
    volumes:
      - ./secrets/master.key:/run/secrets/master.key:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy-admin:/run/caddy
      - /srv/platform/caddy/caddy/certificates:/run/caddy-certs:ro # the mail host's certificate, for the mail server
    depends_on:
      migrate: { condition: service_completed_successfully }
      caddy: { condition: service_started }
    deploy: { resources: { limits: { memory: 256M } } }

  # Builds from git: helper image (git + Railpack). Built and run once by "up"; the
  # agent starts it for each build. Keeping this stopped container also protects the
  # image from "docker image prune -a".
  builder-image:
    image: platform-builder:0.43.0
    build: ./builder
    command: ["true"]
    restart: "no"

  caddy:
    image: platform-caddy:2.11.9-cache-l4
    build: ./caddy   # Caddy + Coraza WAF + rate limit (see caddy/Dockerfile)
    container_name: platform-caddy
    restart: unless-stopped
    logging: *logging
    command: ["caddy", "run", "--config", "/etc/caddy/initial.json"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports: ["80:80", "443:443", "443:443/udp", "465:465"]
    volumes:
      - ./caddy/initial-prod.json:/etc/caddy/initial.json:ro
      - caddy-admin:/run/caddy
      - /srv/platform/caddy:/data
    deploy: { resources: { limits: { memory: 512M } } }   # the WAF rule set needs ~100 MB

  # S3-compatible object storage (Garage). Reached by Caddy and by the API/agent over
  # the compose network only; data in /srv/platform/garage.
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    logging: *logging
    command: ["/garage", "server", "--single-node"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (openssl rand -hex 32)}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - /srv/platform/garage:/var/lib/garage
    deploy: { resources: { limits: { memory: 512M } } }

  # Webmail of hosted mailboxes, at WEBMAIL_HOST: people sign in with their mailbox's
  # address and password. No database, no secrets: it reaches the mail server only.
  webmail:
    image: platform:${PLATFORM_VERSION:-local}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    command: ["webmail"]
    environment:
      STALWART_URL: ${STALWART_URL:-http://stalwart:8080}
      COOKIE_SECURE: "true"
      BASE_URL: https://${CONSOLE_HOST}
    deploy: { resources: { limits: { memory: 256M } } }

  # Hosted mailboxes: SMTP (25 in, 587 submission), IMAP 993, POP3 995. Its admin API
  # (8080) stays on the compose network; data in /srv/platform/stalwart (owned by uid 2000).
  stalwart:
    image: stalwartlabs/stalwart:v1.1.1
    container_name: platform-stalwart
    restart: unless-stopped
    logging: *logging
    # its binary carries the capability to bind ports below 1024 (no no-new-privileges)
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      STALWART_RECOVERY_ADMIN: admin:${STALWART_ADMIN_PASSWORD:?set STALWART_ADMIN_PASSWORD (openssl rand -hex 24)}
    ports: ["25:25", "587:587", "993:993", "995:995"]
    volumes:
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - /srv/platform/stalwart:/var/lib/stalwart
    deploy: { resources: { limits: { memory: 1G } } }

  registry:
    image: registry:2.8.3
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "-c", "sed \"s|__EVENTS_SECRET__|$${REGISTRY_EVENTS_SECRET}|\" /etc/registry/config.tmpl.yml > /tmp/config.yml && exec registry serve /tmp/config.yml"]
    environment:
      REGISTRY_EVENTS_SECRET: ${REGISTRY_EVENTS_SECRET}
      REGISTRY_AUTH_TOKEN_REALM: https://${REGISTRY_HOST}/token
    volumes:
      - ./registry/config.tmpl.yml:/etc/registry/config.tmpl.yml:ro
      - ./secrets/registry-token.crt:/etc/registry/token.crt:ro
      - /srv/platform/registry:/var/lib/registry
    deploy: { resources: { limits: { memory: 256M } } }

  trivy:
    image: aquasec/trivy:0.58.1
    # Reachable by worker nodes over WireGuard only (127.0.0.1 = this server only).
    ports: ["${CONTROL_PLANE_ADDRESS:-127.0.0.1}:4954:4954"]
    restart: unless-stopped
    logging: *logging
    command: ["server", "--listen", "0.0.0.0:4954", "--cache-dir", "/cache"]
    environment:
      TRIVY_TOKEN: ${TRIVY_TOKEN}
    volumes: ["/srv/platform/trivy:/cache"]
    deploy: { resources: { limits: { memory: 1G } } }

  victorialogs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    # Reachable by worker nodes over WireGuard only (127.0.0.1 = this server only).
    ports: ["${CONTROL_PLANE_ADDRESS:-127.0.0.1}:9428:9428"]
    restart: unless-stopped
    logging: *logging
    command: ["-storageDataPath=/vlogs", "-retentionPeriod=31d"]
    volumes: ["/srv/platform/vlogs:/vlogs"]
    deploy: { resources: { limits: { memory: 512M } } }

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.110.0
    # Reachable by worker nodes over WireGuard only (127.0.0.1 = this server only).
    ports: ["${CONTROL_PLANE_ADDRESS:-127.0.0.1}:8428:8428"]
    restart: unless-stopped
    logging: *logging
    command: ["-storageDataPath=/vmdata", "-retentionPeriod=30d"]
    volumes: ["/srv/platform/vmdata:/vmdata"]
    deploy: { resources: { limits: { memory: 512M } } }

networks:
  default:
    name: platform-core

volumes:
  caddy-admin:
  backups:
    name: platform-backups
