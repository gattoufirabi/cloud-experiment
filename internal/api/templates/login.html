{{define "title"}}Log in{{end}}
{{define "content"}}
<section class="narrow">
  <h1>Log in</h1>
  <p class="lede">Accounts are created by invitation. After your password, enter the 6-digit code from your authenticator app.</p>
  <form method="post" action="/login" class="stack">
    <label>Email <input type="email" name="email" value="{{.Email}}" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <div><button type="submit" class="arrow">Continue</button></div>
  </form>
</section>
{{end}}
