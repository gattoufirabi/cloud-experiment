{{define "title"}}Choose a new password{{end}}
{{define "content"}}
<section class="narrow">
  <h1>Choose a new password</h1>
  <p class="lede">For <strong>{{.Email}}</strong>. All your open sessions end when you save it.</p>
  <form method="post" action="/password/reset/{{.Token}}" class="stack">
    <label>New password <span class="hint">at least 12 characters</span><input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" required autofocus></label>
    <label>Repeat password <input type="password" name="password2" minlength="12" maxlength="256" autocomplete="new-password" required></label>
    <div><button type="submit" class="arrow">Save the new password</button></div>
  </form>
</section>
{{end}}
