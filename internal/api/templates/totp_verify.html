{{define "title"}}Two-step code{{end}}
{{define "content"}}
<section class="narrow card">
  <h1>Enter your code</h1>
  <form method="post" action="/totp/verify" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>6-digit code from your authenticator app
      <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus></label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted small">Lost your device? Ask the platform operator to reset two-step login for your account.</p>
</section>
{{end}}
